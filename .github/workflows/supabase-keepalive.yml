name: Supabase keepalive

# Chiama Supabase ogni 2 giorni cosi' il progetto gratuito non va in pausa per inattivita'.
on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chiamata a Supabase
        run: |
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" -X POST \
            "https://kwyhktioyfvpxdnkbwke.supabase.co/rest/v1/rpc/torino_shared_get" \
            -H "apikey: sb_publishable_bdzL_gJUMgfDBWgrwVgYlg_vAqAkcHT" \
            -H "Authorization: Bearer sb_publishable_bdzL_gJUMgfDBWgrwVgYlg_vAqAkcHT" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"
          cat /tmp/out.json
          [ "$code" = "200" ]
