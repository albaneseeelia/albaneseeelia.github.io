name: Deploy Garmin Running Dashboard
on:
  push:
    branches: [main]
    paths:
      - 'garmin/**'
      - '.github/workflows/deploy-garmin.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-garmin
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: garmin
        run: npm install
      - name: Build static site
        working-directory: garmin
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: garmin/out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
