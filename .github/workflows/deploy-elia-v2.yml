name: Deploy Elia Running Intelligence
on:
  push:
    branches: [main]
    paths:
      - 'elia-v2/**'
      - '.github/workflows/deploy-elia-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-elia-v2
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: elia-v2/package-lock.json
      - name: Install dependencies
        working-directory: elia-v2
        run: npm install
      - name: Build static site
        working-directory: elia-v2
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: elia-v2/out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
