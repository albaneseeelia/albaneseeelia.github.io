const n1=x=>x==null?'n/d':x.toFixed(1);
const PG={stato:{h(){const c=(k,n,s)=>`<div class="c"><div class="k">${k}</div><div class="n">${n}</div><div class="s">${s}</div></div>`,k3=sum(inW(21),x=>x.km)/3,k3p=sum(inW(21,21),x=>x.km)/3;
 const rows=[row('Fitness (composito)',FIT.score,st(FIT.pc),FIT.pc,'BASSA','Percentile di qualità, ritmo a basso sforzo ed endurance sulle ultime finestre di 21 g'),
 row('Qualità',M.vel.score,st(M.vel.pc),M.vel.pc,'BASSA',M.vel.cur?`ritmo mediano sedute RPE ≥7: ${P(M.vel.cur)}/km`:'sedute RPE ≥7 insufficienti'),
 row('Ritmo a basso sforzo',M.eff.score,st(M.eff.pc),M.eff.pc,'BASSA',M.eff.cur?`ritmo mediano RPE ≤5 (≥8 km): ${P(M.eff.cur)}/km`:'sedute insufficienti'),
 row('Endurance',M.end.score,st(M.end.pc),M.end.pc,'MEDIA',`media dei 2 lunghi migliori: ${n1(M.end.cur)} km`),
 row('Efficienza (FC)',null,'NON DETERMINABILE',null,'ALTA','nessuna FC nel foglio'),
 row('Durabilità',null,'NON DETERMINABILE',null,'ALTA','mancano split e FC'),
 row('Consistenza',M.cons.score,st(M.cons.pc,8),M.cons.pc,'MEDIA',`${n1(M.cons.cur)} sedute/sett. nelle ultime 3 settimane`),
 row('Volume vs piano',null,adh>1.1?'SOPRA PIANO':adh<.9?'SOTTO PIANO':'IN LINEA',(adh-1)*100,'ALTA',`${(adh*100).toFixed(0)}% su ${cw.length} settimane con piano`),
 row('Carico (modello)',M.car.score,M.car.pc>8?'IN AUMENTO':M.car.pc<-8?'IN DIMINUZIONE':'STABILE',M.car.pc,'BASSA',`${M.car.cur.toFixed(0)} punti LOAD/sett.`),
 row('Fatica',null,ft,(ratio-r14)/r14*100,'BASSA',`ATL/CTL ${ratio.toFixed(2)}; segnale singolo`),
 row('Forma',tsbSc,st(tsbD,3),null,'BASSA',`TSB ${ln.f.toFixed(0)} (${tsbD>0?'+':''}${tsbD.toFixed(0)} in 14 giorni)`),
 row('Recupero soggettivo',null,st(ch(fe0,fe1)),ch(fe0,fe1),'BASSA',`sensazioni medie ${n1(fe0)}/5 vs ${n1(fe1)}/5`)];
 return `<div class="g">${c('Corsa · 3 sett.',k3.toFixed(0)+' km/sett',`${fp(ch(k3,k3p))} · ${(inW(21).length/3).toFixed(1)} sedute/sett`)}${c('Ore di corsa',(sum(inW(21),x=>x.t)/3/3600).toFixed(1)+' h/sett',`${fp(ch(sum(inW(21),x=>x.t),sum(inW(21,21),x=>x.t)))} vs 3 sett. prec.`)}${c('CTL / ATL / TSB',`${ln.c.toFixed(0)} / ${ln.a.toFixed(0)} / ${ln.f.toFixed(0)}`,'modello su LOAD del foglio')}${c('Aderenza al piano',(adh*100).toFixed(0)+'%',`${sum(cw,w=>w.km).toFixed(0)} vs ${sum(cw,w=>w.pl)} km`)}${c('Lungo massimo',Math.max(...A.map(x=>x.km)).toFixed(1)+' km',`${(Math.max(...A.map(x=>x.km))/21.0975*100).toFixed(0)}% della distanza gara`)}</div>
 <h2>Stato attuale</h2>${tb(['Area','Punteggio 0–100','Stato','Trend 21 g','Confidenza','Nota'],rows)}<p class="note">Punteggi = percentile delle finestre mobili di 21 giorni sullo storico di Elena (da ${fd(T0)}): relativi a lei e basati su poche finestre. Non determinabile ≠ nullo.</p>
 <h2>Insight principali</h2>${insights()}<h2>Raccomandazioni</h2>${recs()}
 <h2>Chiedi ai dati</h2>${ASK.map((q,i)=>`<button onclick="ask(${i})">${q[0]}</button>`).join('')}<div id="ans"></div>`}},
running:{h(){const bd=[[6,9,'6–9 km'],[9,12,'9–12 km'],[12,15,'12–15 km'],[15,99,'≥15 km']].map(([a,b,n])=>{const x=R.filter(s=>s.km>=a&&s.km<b).sort((p,q)=>q.v-p.v)[0];return[n,x?`${P(x.v)}/km · RPE ${x.r} · ${fd(x.d)}`:'—']});
 const cs=['facile','media','dura','non comparabile'],dist=cs.map(c=>{const a=inW(21,0,A).filter(x=>cls(x)==c),b=inW(21,21,A).filter(x=>cls(x)==c);return[c,a.length,sum(a,x=>x.km).toFixed(0),b.length,sum(b,x=>x.km).toFixed(0)]});
 return `${cv('cMp','Ritmo di ogni seduta per intensità (RPE) vs passo soglia 5:15 del foglio')}<p class="note" id="mn"></p>${cv('cWk','Km settimanali: previsti vs reali, e numero di sedute')}<p class="note">S10–S12: solo km previsti (nessun dato reale).</p>${cv('cPace','Ritmo delle sedute facili (RPE ≤3, ≥6 km) · COMPARABILITÀ BASSA')}<p class="note" id="pn"></p>
 <h2>Uscita più lunga di ogni settimana</h2>${tb(['Sett.','Data','km','Ritmo','RPE','Sens.','LOAD'],lrs.map(x=>['S'+x.w,fd(x.d),x.km.toFixed(1),x.p>480?'n/c':P(x.v)+'/km',x.r,x.f,x.l.toFixed(0)]))}
 <h2>Classificazione ultime 3 settimane vs precedenti</h2>${tb(['Intensità','Sedute','km','Sedute prec.','km prec.'],dist)}<p class="note">Classi da RPE (facile ≤3, media 4–6, dura ≥7): zone e tipo di seduta non sono nel file.</p>
 <h2>Miglior ritmo per distanza</h2>${tb(['Fascia','Miglior ritmo'],bd)}<p class="note">Ritmi di allenamento non normalizzati; la seduta del 20/09 è esclusa.</p>`},
 d(){mk('cWk',{data:{labels:W.map(w=>'S'+w.w),datasets:[{type:'bar',label:'km previsti',data:W.map(w=>w.pl),backgroundColor:css('--bd')},{type:'bar',label:'km reali',data:W.map(w=>w.km&&+w.km.toFixed(1)),backgroundColor:css('--ac')},{type:'line',label:'sedute',data:W.map(w=>w.n||null),yAxisID:'y1',borderColor:css('--mu'),pointRadius:2}]},options:{scales:{y1:{position:'right',grid:{display:false},min:0}}}});
 const cc={facile:css('--ok'),media:'#4c8dff',dura:css('--ac')},tk={reverse:true,ticks:{callback:v=>(v/60|0)+':'+String(Math.round(v%60)).padStart(2,'0')}},xt={ticks:{callback:v=>fd(new Date(+T0+v*D))}},gx=nd;
 mk('cMp',{type:'scatter',data:{datasets:[...['facile','media','dura'].map(c=>({label:c,data:R.filter(x=>cls(x)==c).map(x=>({x:Math.round((x.d-T0)/D),y:x.p})),backgroundColor:cc[c]})),{type:'line',label:'Passo soglia 5:15',data:[{x:0,y:315},{x:gx,y:315}],borderColor:css('--wa'),pointRadius:0,borderDash:[6,4]}]},options:{scales:{x:xt,y:tk}}});
 const rd=R.filter(x=>x.r>=7),f15=R.filter(x=>x.p<=315);$('#mn').textContent=`${f15.length} sedute con ritmo medio ≤5:15/km su ${R.length}; sedute dure comparabili: ${rd.length}, la più veloce ${rd.length?P(Math.max(...rd.map(x=>x.v)))+'/km':'n/d'}. Il passo soglia 5:15 è un riferimento del foglio, non una zona verificata.`;
 const p=R.filter(x=>x.r<=3&&x.km>=6).map(x=>[Math.round((x.d-T0)/D),x.p]),l=lin(p);
 mk('cPace',{type:'scatter',data:{datasets:[{label:'sedute facili',data:p.map(q=>({x:q[0],y:q[1]})),backgroundColor:css('--ac')},{type:'line',label:'trend',data:[{x:0,y:l.b},{x:gx,y:l.m*gx+l.b}],borderColor:css('--mu'),pointRadius:0}]},options:{scales:{x:xt,y:tk}}});
 $('#pn').textContent=`Trend lineare: ${(l.m*30).toFixed(1)} s/km ogni 30 giorni (${p.length} sedute). Senza FC, temperatura e percorso non basta a dichiarare un cambio di efficienza.`}},
carico:{h(){return `${cv('cLd','Carico cronico (CTL), acuto (ATL) e forma (TSB): modello su LOAD del foglio')}<p class="note">LOAD = colonna del foglio (RPE × durata). CTL 28 g, ATL 7 g. Non è TSS né TRIMP.</p>${cv('cHr','LOAD settimanale e RPE medio')}${cv('cZ','Distribuzione del tempo per intensità RPE (ultime 3 settimane vs precedenti)')}<p class="note">Distribuzione per RPE della seduta intera, non per zone di ritmo/FC.</p>`},
 d(){const lb=S.map((_,i)=>fd(new Date(+T0+i*D)));mk('cLd',{type:'line',data:{labels:lb,datasets:[{label:'CTL',data:S.map(x=>+x.c.toFixed(1)),borderColor:css('--ac'),pointRadius:0},{label:'ATL',data:S.map(x=>+x.a.toFixed(1)),borderColor:'#4c8dff',pointRadius:0},{label:'TSB',data:S.map(x=>+x.f.toFixed(1)),borderColor:css('--mu'),pointRadius:0,borderDash:[4,3]}]},options:{scales:{x:{ticks:{maxTicksLimit:10}}}}});
 mk('cHr',{data:{labels:WD.map(w=>'S'+w.w),datasets:[{type:'bar',label:'LOAD',data:WD.map(w=>+w.ld.toFixed(0)),backgroundColor:css('--ac')},{type:'line',label:'RPE medio',data:WD.map(w=>+w.rpe.toFixed(1)),yAxisID:'y1',borderColor:css('--mu'),pointRadius:2}]},options:{scales:{y1:{position:'right',grid:{display:false},min:0,max:10}}}});
 const sh=o=>{const r=inW(21,o,A).filter(x=>x.p<=480),t={facile:0,media:0,dura:0};r.forEach(x=>t[cls(x)]+=x.t);const s=sum(Object.values(t),x=>x)||1;return Object.values(t).map(x=>+(x/s*100).toFixed(1))};
 mk('cZ',{type:'bar',data:{labels:['Facili (≤3)','Medie (4–6)','Dure (≥7)'],datasets:[{label:'ultime 3 sett. (%)',data:sh(0),backgroundColor:css('--ac')},{label:'precedenti (%)',data:sh(21),backgroundColor:css('--mu')}]}})}},
attivita:{h(){return `<select id="sf" onchange="fl()"><option value="">Tutte le intensità</option>${['facile','media','dura','non comparabile'].map(k=>`<option value="${k}">${k}</option>`).join('')}</select><div id="tt"></div>`},d(){fl()}},
info:{h(){return `<h2>Come funziona</h2><div class="ic"><p>Il dataset contiene ${A.length} sedute dal ${fd(T0)}/2026 al ${fd(LAST)}/2026 (foglio EVALUATION ELENA). Tutti i calcoli sono eseguiti nel browser; ogni valore rispetta la regola “atleta contro se stesso”: percentili su finestre mobili di 21 giorni, confronto con i 21 giorni precedenti.</p><p><b>Cosa non c’è:</b> i fogli ZONE ELENA, PLAN e NOTE EVALUATION, FC, potenza, split e lap. Il piano è noto solo come km settimanali previsti (S2–S15). Zone, sedute qualitative previste, efficienza aerobica e durabilità non sono calcolabili.</p><p><b>Esclusi:</b> la seduta del 20/09 (16,0 km a 9:41/km, RPE 8) è esclusa dai ritmi perché non comparabile; conta in volume e carico.</p><p><b>Modelli:</b> carico, forma e fatica (CTL/ATL/TSB) derivano dal LOAD del foglio; l’intensità è classificata da RPE (facile ≤3, media 4–6, dura ≥7). Con 9 settimane di storico i punteggi sono relativi e poco stabili.</p><p><b>Aggiornamento:</b> per includere nuove sedute si aggiungono righe alla costante RAW nel file e lo si ripubblica; la pagina non legge l’Excel.</p></div>`}}};
function fl(){const s=$('#sf').value,a=[...A].reverse().filter(x=>!s||cls(x)==s);$('#tt').innerHTML=tb(['Data','Sett.','km','Durata','Ritmo','RPE','Sens.','LOAD','Intensità'],a.map(x=>[fd(x.d),'S'+x.w,x.km.toFixed(1),hms(x.t),P(x.v)+'/km',x.r,x.f,x.l.toFixed(0),cls(x)]))}
const TB=[['stato','Stato'],['running','Running'],['carico','Carico'],['attivita','Sedute'],['info','Metodo e dati']];
function go(){const t=CUR||(location.hash||'#stato').slice(1),k=PG[t]?t:'stato';$('#nav').innerHTML=TB.map(([a,n])=>`<a href="#${a}" onclick="return tab('${a}')" class="${a==k?'on':''}">${n}</a>`).join('');
 try{$('#v').innerHTML=PG[k].h();PG[k].d&&PG[k].d()}catch(e){$('#v').innerHTML=`<div class="ic">Errore nel calcolo di questa pagina: ${e.message}</div>`}}
$('#upd').textContent=`Dati fino al ${fd(LAST)}/${LAST.getFullYear()} · ${A.length} sedute`;
$('#cd').textContent=dr>0?`FIAT Torino HM · T−${dr} giorni`:dr==0?'FIAT Torino HM · oggi':'FIAT Torino HM · conclusa';
let CUR='';function tab(k){CUR=k;go();scrollTo(0,0);return false}addEventListener('hashchange',()=>{CUR='';go()});go();
</script></body></html>
