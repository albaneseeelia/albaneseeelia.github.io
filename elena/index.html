  if(x.slice(-2).every(v=>v.d<-15))o.push({t:'Interpretazione',tn:'w',h:'Volume sotto il piano',x:'Le ultime due settimane concluse sono sotto il piano di oltre il 15%: il carico di rifinitura è di fatto già in corso, con meno corse della programmazione.'})}
 const fm=formAt(r),fo=formAt(addD(r,-14));if(fm)o.push({t:'Dato',tn:fm.f>.15*fm.a42?'g':fm.f<-.15*fm.a42?'b':'n',h:'Training Form',x:`Form ${sg(fm.f,1)}: carico medio 42 g ${fk(fm.a42)}/giorno, ultimi 7 g ${fk(fm.a7)}/giorno${fo?`. Due settimane fa era ${sg(fo.f,1)}`:''}.`});
 if(fm)o.push({t:'Interpretazione',tn:'n',h:'Lettura del Form',x:fm.f>0?'Il carico recente è inferiore alla media cronica: situazione di scarico/recupero. Non è una misura clinica di forma fisica.':'Il carico recente supera la media cronica: fase di accumulo, più fatica attesa.'});
 const ez=(f,t)=>A.filter(a=>a.d>=f&&a.d<=t&&a.rpe<=4&&a.km>=6&&!a.an),e1=ez(addD(r,-27),r),e0=ez(addD(r,-55),addD(r,-28));if(e1.length>=2&&e0.length>=2&&pd(addD(r,-55))>=pd(FIRST)){const f=a=>a.reduce((x,y)=>x+y.s,0)/a.reduce((x,y)=>x+y.km,0);o.push({t:'Dato',tn:tone('p',(f(e1)-f(e0))/f(e0)*100),h:'Passo a parità di sforzo (RPE ≤4)',x:`Corse facili ≥6 km: ${fp(f(e1))}/km negli ultimi 28 g (${e1.length} uscite) vs ${fp(f(e0))}/km nei 28 g precedenti (${e0.length}): ${sg(f(e1)-f(e0),0)} s/km con RPE medio ${fk(avg(e1.map(a=>a.rpe)))} vs ${fk(avg(e0.map(a=>a.rpe)))}.`})}
 const lg=A.reduce((a,b)=>b.km>a.km?b:a,A[0]),l15=A.filter(a=>a.km>=15&&!a.an);o.push({t:'Dato',tn:'n',h:'Uscite lunghe',x:`${l15.length} uscite ≥15 km; la più lunga è ${fk(lg.km)} km il ${fdy(lg.d)} (${(lg.km/HM*100).toFixed(0)}% della mezza), l'ultima ≥15 km il ${l15.length?fdy(l15[l15.length-1].d):'n.d.'}.`});
 const wl=S.plan.filter(p=>p.mon>r);if(wl.length)o.push({t:'Dato',tn:'n',h:'Piano residuo',x:`Il piano prevede ${wl.map(p=>p.p).join(' / ')} km nelle settimane rimanenti (dal ${fd(wl[0].mon)}).`});
 const cw=[];for(let m=mon(FIRST);addD(m,6)<=r;m=addD(m,7))cw.push(agg(m,addD(m,6)));let gap=0,run=0;for(let d=FIRST;d<=r;d=addD(d,1)){if(DL[d]>0)run=0;else{run++;gap=Math.max(gap,run)}}
 o.push({t:'Dato',tn:cw.filter(w=>w.n>=3).length/cw.length>=.8?'g':'n',h:'Regolarità',x:`${cw.filter(w=>w.n>=3).length} settimane su ${cw.length} concluse con almeno 3 uscite (media ${fk(avg(cw.map(w=>w.n)))} uscite/sett.). Pausa più lunga: ${gap} giorni consecutivi senza correre.`});

function vInsight(){return`<h2>Insight Engine</h2><div class="note" style="margin-bottom:12px">Ogni insight è calcolato dai ${A.length} allenamenti del file (riferimento ${fdy(REF)}). Etichette: <b>Dato</b> = misura diretta, <b>Interpretazione</b> = lettura del dato, <b>Ipotesi</b> = spiegazione plausibile non verificabile.</div>${insights().map(i=>`<div class="ins ${i.tn}"><h4><span class="tag ${i.t}">${i.t}</span>${i.h}</h4><p>${i.x}</p></div>`).join('')}`}
/* ---------- shell ---------- */
const TABS=[['stato','Stato'],['analisi','Analisi'],['storico','Storico'],['confronto','Confronto'],['gara','Gara'],['report','Report'],['insight','Insight']];

function render(){derive();chips();
 $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');
 const showBar=['analisi','storico'].includes(S.tab);$('#bar').style.display=showBar?'flex':'none';
 $('#bar').innerHTML=[['7','7 g'],['21','21 g'],['42','42 g'],['90','90 g'],['180','6 mesi'],['365','1 anno'],['all','Storico']].map(([k,l])=>`<button class="${S.per===k?'on':''}" onclick="setPer('${k}')">${l}</button>`).join('')+`<button class="${S.per==='custom'?'on':''}" onclick="setPer('custom')">Personalizzato</button>`+(S.per==='custom'?`<input type="date" value="${S.from||FIRST}" onchange="S.from=this.value;render()"><input type="date" value="${S.to||REF}" onchange="S.to=this.value;render()">`:'')+`<span class="lg">Running: <b>${A.length}</b> · Trail: n.d. (non nel file)</span>`;
 const v={stato:vStato,analisi:vAnalisi,storico:vStorico,confronto:vConfronto,gara:vGara,report:vReport,insight:vInsight}[S.tab];
 try{$('#main').innerHTML=v();if(S.tab==='analisi')drawAnalisi();if(S.tab==='gara')drawGara();if(S.sel)drawWk()}catch(e){$('#main').innerHTML='<div class="note">Errore di rendering: '+e.message+'</div>';console.error(e)}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',5000)}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function expCsv(){dl('allenamenti.csv','data;km;durata_s;passo_s_km;rpe;sensazioni;carico;categoria\n'+A.map(a=>[a.d,a.km,a.s,a.p.toFixed(1),a.rpe,a.fe,a.ld,a.c].join(';')).join('\n'),'text/csv')}

/* import */
$('#f').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(typeof XLSX==='undefined')return toast('Importazione non disponibile: libreria XLSX non caricata (serve connessione).');
 const r=new FileReader();r.onerror=()=>toast('Impossibile leggere il file.');r.onload=ev=>{try{
  const wb=XLSX.read(ev.target.result,{type:'array'});let hdr=-1,rows,sh;
  for(const n of wb.SheetNames){const R=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});const i=R.findIndex(r=>r.includes('DAY')&&r.includes('DISTANCE'));if(i>=0){hdr=i;rows=R;sh=n;break}}
  if(hdr<0)throw new Error('Nessun foglio con colonne DAY e DISTANCE.');

  const iso=n=>ds(new Date(Math.round((n-25569)*864e5)));let add=0,upd=0,bad=0,fd0=null;const old=Object.fromEntries(S.rows.map(r=>[r.d,r]));
  for(const r of rows.slice(hdr+1)){const dv=r[ci.d];if(typeof dv!=='number')continue;const d=iso(dv);if(!fd0||d<fd0)fd0=d;const km=+r[ci.km];if(!(km>0))continue;const tv=r[ci.t],s=typeof tv==='number'?Math.round(tv*86400):0;if(!s){bad++;continue}
   let ld=ci.ld>=0&&typeof r[ci.ld]==='number'?r[ci.ld]:null;const rpe=r[ci.rpe],fe=r[ci.fe];if(ld==null&&rpe!=null&&fe!=null)ld=.1*Math.round(s/60)*rpe*(S.thr/(s/km))*(1+(3-fe)*.1)*2;
   const n={d,km,s,rpe,fe,ld:ld==null?0:+ld.toFixed(3)};if(old[d]){if(JSON.stringify(old[d])!==JSON.stringify(n))upd++}else add++;old[d]=n}
