function l3(){const a=A.find(x=>x.id==S.sel);if(!a||!a.laps||a.laps.length<2)return;const L=a.laps.filter(l=>l[0]>=.5);
mk("c3",{data:{labels:L.map((l,i)=>"Lap "+(i+1)),datasets:[{type:"bar",label:"Passo (min/km)",data:L.map(l=>l[1]/l[0]),backgroundColor:"#5b8defcc",borderRadius:6,yAxisID:"y"},{type:"line",label:"FC (bpm)",data:L.map(l=>l[2]),borderColor:"#d44a5a",tension:.3,pointRadius:3,yAxisID:"y2"}]},options:{interaction:{mode:"index",intersect:false},scales:{y:{reverse:true,min:Math.min(...L.map(l=>l[1]/l[0]))-30,ticks:{callback:v=>fpace(v,1)}},y2:{position:"right",grid:{drawOnChartArea:false}}},plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+": "+(c.datasetIndex?c.parsed.y:fpace(c.parsed.y,1))}}}}})}
function tick(){$("#clk").innerHTML="<b>"+new Date().toLocaleString("it-IT",{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})+"</b>";const c=$("#cd");if(c){let s=Math.max(0,Math.floor((GOAL.d-new Date())/1000));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);c.innerHTML=[[d,"giorni"],[h,"ore"],[m,"min"],[s%60,"sec"]].map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join("")}}
$("#nav").innerHTML=NAV.map(([v,l])=>`<button data-v="${v}" onclick="go('${v}')">${l}</button>`).join("");$("#nact").textContent=A.length;
setInterval(tick,1000);render();
</script></body></html>
