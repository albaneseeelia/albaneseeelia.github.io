V.gara=()=>{const M=model();if(!M)return'<div class="card">Servono più dati per la proiezione.</div>';const T={obj:GOAL.t,opt:M.opt,real:M.real,pess:M.pess}[S.gp],go_=M.opt-GOAL.t,gap=M.real-GOAL.t;

<div class="card c12"><h3>Performance prediction</h3>${curveSvg(M)}<div class="zcards">${sc("Ottimistico",M.opt,"#1b9e74")}${sc("Realistico",M.real,"#2349c9")}${sc("Pessimistico",M.pess,"#e58a2f")}${sc("Obiettivo",GOAL.t,"#12244a")}</div>
<div class="vd"><b>${go_>0?"L’obiettivo è più veloce anche dello scenario ottimistico":"L’obiettivo rientra nello scenario ottimistico"}</b><br>${tg.h}Realistico ${gap>0?"+":"−"}${hms(Math.abs(gap))} rispetto a ${hms(GOAL.t)}; ottimistico ${go_>0?"+":"−"}${hms(Math.abs(go_))}; pessimistico +${hms(M.pess-GOAL.t)}.${go_>0?` Per fare ${hms(GOAL.t)} servirebbe guadagnare circa ${f1(go_/GOAL.km,0)} s/km rispetto allo scenario ottimistico.`:""} La curva è una rappresentazione della forbice, non una probabilità calcolata.</div></div>
<div class="card c12"><h3>Tracciato e consigli di gara</h3>${mapSvg()}<div class="vd" id="segcap" style="margin-top:8px"></div><p class="mut">${tg.d}Tracciato 2026: partenza da piazza Vittorio Veneto, via Po, viali verso Mirafiori, Beinasco, Stupinigi, Nichelino, Moncalieri, lungo Po con Italia ’61 e Valentino, arrivo in piazza Castello (km dei passaggi dalla guida di Monumenti di Corsa, ricavata dalla mappa ufficiale).<br>${tg.h}Le coordinate sono approssimate dai passaggi, non il GPX: strade e distanze tra i punti possono differire di centinaia di metri. I numeri nei cerchi sono i chilometri. Tocca un tratto per leggere il consiglio.</p></div>
