PG.proiezione={h(){return `<div class="rw"><input id="tg" value="${hms(TG)}" inputmode="text" onchange="proj()" aria-label="Tempo obiettivo h:mm:ss"></div><p class="note">Modifica il tempo obiettivo (h:mm:ss) per ricalcolare scostamenti e coerenza.</p><div id="pj"></div>`},d(){proj()}};
function proj(){const m=$('#tg').value.match(/^(\d+):(\d\d)(?::(\d\d))?$/);if(m)TG=+m[1]*3600+ +m[2]*60+ +(m[3]||0);const g=TG/42.195;
 const EVS=A.filter(x=>x.s=='R'&&x.f=='G'&&x.km>=9.9&&x.km<=31).map(x=>({x,t:rg(x.t,x.km)}));let bs=1e9;EVS.forEach(e=>{bs=Math.min(bs,e.t);e.b=bs});
 const SS=Object.entries(DET).map(([k,d])=>({k,s:lapSt(d,TG),x:RS.find(y=>key(y)==k&&y.s=='R'&&y.km>25)})).sort((a,b)=>a.k<b.k?-1:1),
 la=EVS[EVS.length-1],gl=la?(la.b-TG)/42.195:null,spc=SS.filter(s=>s.s.wd/1000>=16&&s.s.wp<=g+2),
 lg=R.filter(x=>x.km>=28&&x.d>=E-28*D).length,
 cr=[[`≥3 punti di evidenza (${EVS.length})`,EVS.length>=3],[`la stima migliore migliora rispetto alla prima`,EVS.length>=2&&la.b<EVS[0].t],[`≥3 lunghi ≥28 km nelle ultime 4 settimane (${lg})`,lg>=3],[`almeno una seduta con ≥16 km di lavoro entro 2 s/km dal ritmo target (${spc.length})`,spc.length>0],[`stima entro 5 s/km dal target${gl==null?'':' ('+(gl>0?'+':'')+gl.toFixed(0)+' s/km)'}`,gl!=null&&gl<=5]],n=cr.filter(c=>c[1]).length,lab=n==5?'COERENTE':n==4?'QUASI COERENTE':n==3?'PARZIALE':'DEBOLE';
 $('#pj').innerHTML=`<div class="g"><div class="c"><div class="k">Target</div><div class="n">${hms(TG)}</div><div class="s">${P(1000/g)}/km</div></div><div class="c"><div class="k">Miglior stima</div><div class="n">${la?hms(la.b):'n/d'}</div><div class="s">${la?(gl>0?'+':'')+gl.toFixed(0)+' s/km · '+hms(Math.abs(la.b-TG))+(la.b>TG?' sopra':' sotto'):''}</div></div><div class="c"><div class="k">Coerenza preparazione</div><div class="n">${lab}</div><div class="s">${n}/5 criteri · stime: confidenza ${EVS.length<4?'BASSA':'MEDIA'}</div></div><div class="c"><div class="k">Gara tra</div><div class="n">${dr>0?dr+' giorni':'—'}</div></div></div>
 ${cv('cP1','Proiezione maratona (Riegel 1,06) vs tempo obiettivo')}${cv('cP2','Scostamento dal ritmo target (s/km): stime e sedute specifiche')}
 <h2>Evidenze</h2>${tb(['Data','Fonte','km','Ritmo reale','Stima maratona','Scostamento'],EVS.map(e=>[fd(e.x.d),e.x.n+(/triathlon/i.test(e.x.n)?' (dopo nuoto e bici)':''),e.x.km.toFixed(1),P(e.x.v)+'/km',hms(e.t),((e.t-TG)/42.195>0?'+':'')+((e.t-TG)/42.195).toFixed(0)+' s/km']).concat(SS.map(s=>[s.k.slice(2)+'/'+s.k.slice(0,2),'seduta per giri (lavoro)',(s.s.wd/1000).toFixed(1),P(1000/s.s.wp)+'/km','non stimata',((s.s.wp-g)>0?'+':'')+(s.s.wp-g).toFixed(0)+' s/km'])))}
 <p class="note">Le sedute per giri non producono una stima maratona: il lavoro è frazionato con recuperi. La stima maratona usa solo gare ed eventi; il 10 km di Bardolino è stato corso dopo nuoto e bici.</p>
 <h2>Coerenza della preparazione</h2><div class="ic"><ul>${cr.map(c=>`<li>${c[1]?'✓':'✗'} ${c[0]}</li>`).join('')}</ul><p class="mu">${n} criteri su 5 soddisfatti: ${lab}. Con ${EVS.length} sole stime, su fondi e dislivelli diversi, il giudizio è indicativo.</p></div>
 <h2>Cosa osservare</h2><div class="ic"><ul>${la?`<li>Scostamento della miglior stima: ${(gl>0?'+':'')+gl.toFixed(0)} s/km (${hms(Math.abs(la.b-TG))} ${la.b>TG?'sopra':'sotto'} il target).</li>`:''}${SS.map(s=>`<li>${s.k.slice(2)}/${s.k.slice(0,2)}: ${(s.s.wd/1000).toFixed(0)} km di lavoro a ${P(1000/s.s.wp)}/km, FC media lavoro ${Math.round(s.s.hw)} bpm; blocco continuo a ritmo target più lungo: ${(s.s.mb/1000).toFixed(0)} km.</li>`).join('')}<li>Manca un test continuo a ritmo gara oltre ${Math.max(0,...SS.map(s=>s.s.mb/1000)).toFixed(0)} km: è l’evidenza che renderebbe più solida la stima.</li></ul></div>`;
 const lb=EVS.map(e=>fd(e.x.d)+' '+e.x.n.slice(0,14)),yf=v=>hms(v);
 mk('cP1',{type:'line',data:{labels:lb,datasets:[{label:'Stima evento',data:EVS.map(e=>Math.round(e.t)),borderColor:css('--ac'),pointRadius:5},{label:'Migliore fino a quel giorno',data:EVS.map(e=>Math.round(e.b)),borderColor:'#4c8dff',stepped:true,pointRadius:0},{label:'Target',data:EVS.map(()=>TG),borderColor:css('--ok'),borderDash:[6,4],pointRadius:0}]},options:{scales:{y:{ticks:{callback:yf}}}}});
 const bl=EVS.map(e=>'Stima '+fd(e.x.d)).concat(SS.map(s=>'Lavoro '+s.k.slice(2)+'/'+s.k.slice(0,2))),bv=EVS.map(e=>+((e.t-TG)/42.195).toFixed(1)).concat(SS.map(s=>+(s.s.wp-g).toFixed(1)));
 mk('cP2',{type:'bar',data:{labels:bl,datasets:[{label:'s/km vs target (negativo = più veloce)',data:bv,backgroundColor:bv.map(v=>v<=0?css('--ok'):css('--ac'))}]}})}
function fl(){const s=$('#sf').value,a=[...A].reverse().filter(x=>!s||x.s==s).slice(0,120);$('#tt').innerHTML=tb(['Data','Sport','Nome','km','Durata','Ritmo/Vel.','D+','Classe'],a.map(x=>[fd(x.d),SP[x.s]+(x.n=='virt'?' (virtuale)':''),x.s=='R'||x.s=='T'?x.n:'',x.km.toFixed(1),hms(x.t),x.s=='B'?(x.v*3.6).toFixed(1)+' km/h':P(x.v)+'/km',x.e,cls(x)]))}
const TB=[['stato','Stato'],['running','Running'],['carico','Carico'],['seduta','Analisi attività'],['proiezione','Proiezione maratona'],['attivita','Attività'],['info','Metodo e dati']];
function go(){const t=CUR||(location.hash||'#stato').slice(1),k=PG[t]?t:'stato';$('#nav').innerHTML=TB.map(([a,n])=>`<a href="#${a}" onclick="return tab('${a}')" class="${a==k?'on':''}">${n}</a>`).join('');
 try{$('#v').innerHTML=PG[k].h();PG[k].d&&PG[k].d()}catch(e){$('#v').innerHTML=`<div class="ic">Errore nel calcolo di questa pagina: ${e.message}</div>`}}
$('#upd').textContent=`Dati fino al ${fd(LAST)}/${LAST.getFullYear()} · ${A.length} attività`;
$('#cd').textContent=dr>0?`Torino Marathon · T−${dr} giorni`:dr==0?'Torino Marathon · oggi':'Torino Marathon · conclusa';
let CUR='';function tab(k){CUR=k;go();scrollTo(0,0);return false}addEventListener('hashchange',()=>{CUR='';go()});go();
</script></body></html>
