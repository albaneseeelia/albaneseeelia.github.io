function spCalc(){const st=SP.st,P={},S={},Sn={},Rc={},bal={};(st.members||[]).forEach(m=>{P[m.id]=0;S[m.id]=0;Sn[m.id]=0;Rc[m.id]=0});let tot=0,n=0;

function spPlan(bal){const ids=Object.keys(bal).filter(k=>bal[k]!==0);const n=ids.length;let groups=[];
if(n&&n<=14){const N=1<<n,sum=new Int32Array(N),dp=new Int16Array(N);for(let m=1;m<N;m++){const lb=m&-m,i=31-Math.clz32(lb);sum[m]=sum[m^lb]+bal[ids[i]]}
for(let m=1;m<N;m++){let best=0;for(let i=0;i<n;i++)if(m>>i&1){const v=dp[m^(1<<i)];if(v>best)best=v}dp[m]=best+(sum[m]===0?1:0)}
let m=N-1,cur=[],run=0;while(m){const z=sum[m]===0;let pick=-1;for(let i=0;i<n;i++)if(m>>i&1&&dp[m^(1<<i)]===dp[m]-(z?1:0)){pick=i;break}if(pick<0)pick=31-Math.clz32(m);cur.push(ids[pick]);m^=1<<pick;if(cur.reduce((s,k)=>s+bal[k],0)===0){groups.push(cur);cur=[]}}
if(cur.length)groups.push(cur)}else groups=n?[ids]:[];
const out=[];groups.forEach(g=>{const d=g.filter(k=>bal[k]<0).map(k=>[k,-bal[k]]).sort((x,y)=>x[1]-y[1]),c=g.filter(k=>bal[k]>0).map(k=>[k,bal[k]]).sort((x,y)=>y[1]-x[1]);let i=0,j=0;while(i<d.length&&j<c.length){const a=Math.min(d[i][1],c[j][1]);if(a>0)out.push({f:d[i][0],t:c[j][0],a});d[i][1]-=a;c[j][1]-=a;if(d[i][1]===0)i++;if(c[j][1]===0)j++}});return out}

function spSettings(){const st=SP.st;spOpen(`<h3>Impostazioni</h3><div class="sp-pr" style="grid-template-columns:1fr auto;padding:0 0 4px"><input class="sp-inp" style="text-align:left" id="ss-n" value="${spE(st.name)}" maxlength="40" aria-label="Nome della nota spese"><button class="sp-go" id="ss-r" type="button">Salva</button></div><div class="sp-ss">Valuta ${spE(spCur())} · ${SP.me&&spMem(SP.me)?"Sei "+spE(spName(SP.me)):"Non hai scelto il tuo nome"} · <a href="#" id="ss-w">${SP.me?"cambia":"scegli"}</a></div>
<div class="sp-h">Partecipanti</div><div class="sp-chs">${spAct().map(m=>`<span class="sp-pc"><button class="sp-pn" data-mem="${m.id}" type="button">${spAv(m.id,"sm")}${spE(m.n)}</button><button class="sp-px" data-rm="${m.id}" type="button" aria-label="Rimuovi ${spE(m.n)}" title="Rimuovi">✕</button></span>`).join("")}<button class="sp-add" id="ss-m" type="button">＋ Aggiungi</button></div>
<div class="sp-h">Esporta</div><div class="sp-btns two" style="margin-top:0"><button class="sp-b sm" id="ss-c" type="button">CSV</button><button class="sp-b sm" id="ss-p" type="button">PDF</button></div>
<button class="sp-del" id="ss-d" type="button">Elimina la nota spese</button>`,ov=>ov.addEventListener("click",ev=>{if(ev.target.closest("#ss-w")){ev.preventDefault();spWho(null,spSettings);return}const rm=ev.target.closest("[data-rm]"),mm=ev.target.closest("[data-mem]");if(rm){spClose(true);spRemove(rm.dataset.rm);return}if(mm){spClose(true);spMemD(mm.dataset.mem);return}const id=(ev.target.closest("button")||{}).id;if(id==="ss-r"){const n=$("#ss-n").value.trim();if(!n)return;spSet(s=>{s.name=n;s.nts=Date.now()},"Nota spese rinominata in «"+n+"»");spClose();toast("Nota spese rinominata")}else if(id==="ss-m"){spClose(true);spAddM()}else if(id==="ss-c")spCsv();else if(id==="ss-p")spPdf();else if(id==="ss-d"){spClose(true);spConfirm("Eliminare la nota spese?","Spese, pagamenti e partecipanti verranno cancellati per tutti. Questa azione non si può annullare.","Continua",()=>setTimeout(()=>spConfirm("Ultima conferma","Vuoi davvero eliminare «"+spE(st.name)+"» per tutti i partecipanti?","Elimina definitivamente",()=>{SP.st={gid:spId(),gts:Date.now(),del:true,name:"",nts:0,cur:"EUR",members:[],exp:[],pay:[],log:[]};SP.me=null;LS.set("spMe",null);LS.set("spState",SP.st);spRender();spFab();spSoon();toast("Nota spese eliminata")},true),240),true)}}))}
function spAddM(){spOpen(`<h3>Nuovo partecipante</h3><input class="sp-inp" id="am-n" placeholder="Nome" maxlength="24"><div class="sp-btns" style="margin-top:12px"><button class="sp-b p" id="am-ok" type="button">Aggiungi</button></div>`,ov=>{ov.addEventListener("click",e=>{if(e.target===ov||e.target.closest(".sp-x")){e.stopImmediatePropagation();spSettings()}},true);const go=()=>{const n=$("#am-n").value.trim();if(!n)return;spClose();spAdd(n);toast(n+" aggiunto")};$("#am-ok").onclick=go;$("#am-n").onkeydown=e=>{if(e.key==="Enter")go()};setTimeout(()=>$("#am-n").focus(),260)})}
function spCsv(){const st=SP.st,mem=st.members,q=v=>'"'+String(v).replace(/"/g,'""')+'"',n=c=>(c/100).toFixed(2).replace(".",",");const rows=[["Data","Descrizione","Categoria","Pagato da","Importo","Tipo"].concat(mem.map(m=>"Quota "+m.n)).map(q).join(";")];
st.exp.filter(e=>!e.del).sort((a,b)=>a.dt<b.dt?-1:1).forEach(e=>rows.push([e.dt,e.d,spCat(e.c)[2],spName(e.p),n(e.a),"Spesa"].concat(mem.map(m=>(e.sp||{})[m.id]!=null?n(e.sp[m.id]):"")).map(q).join(";")));
st.pay.filter(p=>!p.del).forEach(p=>rows.push([p.dt,"Pagamento "+spName(p.f)+" → "+spName(p.t),"",spName(p.f),n(p.a),"Pagamento"].concat(mem.map(()=>"")).map(q).join(";")));
const b=new Blob(["﻿"+rows.join("\r\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(st.name||"spese").replace(/[^\w\-]+/g,"_")+".csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast("CSV esportato")}
function spPdf(){const st=SP.st,C=spCalc(),plan=spPlan(C.bal);
const W="278 278 355 556 556 889 667 191 333 333 389 584 278 333 278 278 556 556 556 556 556 556 556 556 556 556 278 278 584 584 584 556 1015 667 667 722 722 667 611 778 722 278 500 667 556 833 722 778 667 778 722 667 611 722 667 944 667 667 611 278 278 278 469 556 333 556 556 500 556 556 278 556 556 222 222 500 222 833 556 556 556 556 333 500 278 556 500 722 500 500 500 334 260 334 584".split(" ").map(Number);
const enc=t=>String(t).replace(/→/g,">").replace(/[−–—]/g,"-").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").split("").map(c=>{const n=c.charCodeAt(0);return n===8364?128:(n>=32&&n<127)||(n>=160&&n<256)?n:63});
const tw=(t,z)=>enc(t).reduce((q,n)=>q+(n>=32&&n<127?W[n-32]:n===128?556:556),0)*z/1000;
const esc=t=>enc(t).map(n=>n===40||n===41||n===92?"\\"+String.fromCharCode(n):n<127?String.fromCharCode(n):"\\"+n.toString(8).padStart(3,"0")).join("");
const pages=[];let cur=null,y=0;const L=48,R=547,top=794;
const np=()=>{cur=[];pages.push(cur);y=top};np();
const txt=(t,x,yy,z,f,col)=>cur.push((col||"0.11 0.14 0.15")+" rg BT /"+f+" "+z+" Tf "+x.toFixed(1)+" "+yy.toFixed(1)+" Td ("+esc(t)+") Tj ET");
const rule=yy=>cur.push("0.9 0.88 0.84 RG 0.5 w "+L+" "+yy.toFixed(1)+" m "+R+" "+yy.toFixed(1)+" l S");
const fit=(t,max,z)=>{if(tw(t,z)<=max)return t;while(t.length>1&&tw(t+"...",z)>max)t=t.slice(0,-1);return t+"..."};
const head=t=>{if(y<110)np();y-=26;txt(t.toUpperCase(),L,y,9,"F2","0.12 0.37 0.36");y-=8;rule(y)};
const row=(l,r)=>{if(y<60){np()}y-=19;const rw=r?tw(r,10.5):0;txt(fit(l,R-L-rw-14,10.5),L,y,10.5,"F1");if(r)txt(r,R-rw,y,10.5,"F1");rule(y-5)};
const d8=x=>{const q=String(x).split("-");return q.length===3?q[2]+"/"+q[1]+"/"+q[0]:x};
txt(st.name,L,y-=24,22,"F2");y-=18;txt(spAct().length+" partecipanti · "+spCur()+" · esportato il "+new Date().toLocaleDateString("it-IT"),L,y,10,"F1","0.42 0.45 0.48");
head("Riepilogo");row("Spese totali",spM(C.tot));row("A persona",spM(C.per));row("Spese registrate",String(C.n));
head("Saldi");spAct().forEach(m=>row(m.n,"pagato "+spM(C.P[m.id]||0)+" · quota "+spM(C.S[m.id]||0)+" · saldo "+spS(C.bal[m.id])));
head("Rimborsi da fare");if(plan.length)plan.forEach(q=>row(spName(q.f)+" -> "+spName(q.t),spM(q.a)));else row("Tutto regolato","");
head("Spese");const ex=st.exp.filter(e=>!e.del).sort((a,b)=>a.dt<b.dt?1:-1);if(ex.length)ex.forEach(e=>row(d8(e.dt)+" · "+e.d+" ("+spName(e.p)+")",spM(e.a)));else row("Nessuna spesa registrata","");
const pay=(st.pay||[]).filter(e=>!e.del).sort((a,b)=>a.dt<b.dt?1:-1);if(pay.length){head("Rimborsi effettuati");pay.forEach(e=>row(d8(e.dt)+" · "+spName(e.f)+" -> "+spName(e.t),spM(e.a)))}
const o=[];const add=x=>{o.push(x);return o.length};
add("<< /Type /Catalog /Pages 2 0 R >>");add("");add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
const kids=[];pages.forEach(pg=>{const c=pg.join("\n");const ci=add("<< /Length "+c.length+" >>\nstream\n"+c+"\nendstream");const pi=add("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+ci+" 0 R >>");kids.push(pi+" 0 R")});
o[1]="<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+pages.length+" >>";
let out="%PDF-1.4\n";const off=[];o.forEach((x,i)=>{off.push(out.length);out+=(i+1)+" 0 obj\n"+x+"\nendobj\n"});const xr=out.length;out+="xref\n0 "+(o.length+1)+"\n0000000000 65535 f \n"+off.map(n=>String(n).padStart(10,"0")+" 00000 n \n").join("")+"trailer\n<< /Size "+(o.length+1)+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF";
const by=new Uint8Array(out.length);for(let i=0;i<out.length;i++)by[i]=out.charCodeAt(i)&255;
const url=URL.createObjectURL(new Blob([by],{type:"application/pdf"}));const w=window.open(url,"_blank");if(!w){const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()}setTimeout(()=>URL.revokeObjectURL(url),120000)}
/* eventi */
function spPayDo(i){const C=spCalc(),plan=spPlan(C.bal),p=plan[i];if(!p)return;spConfirm("Confermare il rimborso?",spE(spName(p.f))+" ha rimborsato "+spM(p.a)+" a "+spE(spName(p.t))+"?","Conferma",()=>spPayGo(p))}
function spPayGo(p){const id="p_"+spId();spSet(s=>{s.pay.push({id,f:p.f,t:p.t,a:p.a,dt:spToday(),tm:new Date().toTimeString().slice(0,5),ts:Date.now()})},"Rimborsato: "+spName(p.f)+" → "+spName(p.t)+" ("+spM(p.a)+")");vib(15);toast("Rimborso registrato: "+spName(p.f)+" → "+spName(p.t),"Annulla",()=>spSet(s=>{const x=s.pay.find(y=>y.id===id);x.del=true;x.ts=Date.now()},"Rimborso annullato: "+spName(p.f)+" → "+spName(p.t)))}
function spBind(){const el=$("#ps");el.addEventListener("click",e=>{const t=e.target;let b;
if(b=t.closest(".sp-hd")){const k=b.parentNode.dataset.k;SP.open[k]=!SP.open[k];b.parentNode.classList.toggle("open",!!SP.open[k]);b.setAttribute("aria-expanded",!!SP.open[k]);LS.set("spOpen",SP.open);return}
if(b=t.closest("[data-rm]")){spRemove(b.dataset.rm);return}if(b=t.closest("[data-pay]")){spPayDo(+b.dataset.pay);return}if(b=t.closest("[data-exp]")){spExp(b.dataset.exp);return}if(b=t.closest("[data-pyd]")){spPayD(b.dataset.pyd);return}if(b=t.closest("[data-mem]")){spMemD(b.dataset.mem);return}
const id=(t.closest("button")||{}).id;if(id==="sp-set")spSettings();else if(id==="sp-inv"||id==="sp-inv2")spShare();else if(id==="sp-who")spWho();else if(id==="sp-ft"){spSlide($("#sp-fl"))}else if(id==="sp-addm")spAddM();
else if(id==="su-go"){const n=$("#su-n").value.trim(),m=$("#su-m").value.trim();if(!n||!m){toast("Inserisci il nome della nota spese e il tuo nome");return}const mid="m_"+spId();SP.me=mid;LS.set("spMe",mid);spSet(s=>{s.gid=spId();s.gts=Date.now();delete s.fresh;delete s.del;s.name=n;s.nts=Date.now();s.cur=$("#su-c").value;s.members=[{id:mid,n:m,ts:Date.now()}]},"Nota spese creata «"+n+"»");spFab();toast("Nota spese creata")}
else if(id==="su-demo"){SP.st=spDemo(spId(),Date.now());SP.me=null;LS.set("spMe",null);LS.set("spState",SP.st);spRender();spFab();spSoon()}});
el.addEventListener("input",e=>{const t=e.target;if(t.id==="sp-q"){SP.q=t.value;$("#sp-hl").innerHTML=spHist()}});
el.addEventListener("change",e=>{const t=e.target;if(t.id==="sp-fp"||t.id==="sp-fc"){SP[t.id.slice(3)]=t.value;$("#sp-hl").innerHTML=spHist()}});
const fab=document.createElement("button");fab.id="spfab";fab.className="sp-fab";fab.type="button";fab.hidden=true;fab.innerHTML="<b>+</b> Aggiungi spesa";fab.onclick=()=>{if(!spAct().length){spAddM();return}spForm()};document.body.appendChild(fab);
document.addEventListener("keydown",e=>{if(e.key==="Escape")spClose()})}
function spOnTab(){if(typeof SP==="undefined"||!SP.st)return;if(tab==="s")spRender();spFab()}
(function(){spInit();spBind();spRender();spFab();if(location.hash==="#spese")setTab("s");addEventListener("hashchange",()=>{if(location.hash==="#spese")setTab("s")});spSync();setInterval(()=>{if(!document.hidden)spSync()},20000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)spSync()});addEventListener("online",spSync)})();
</script></body></html>
