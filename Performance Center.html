info:{h(){return `<h2>Come funziona</h2><div class="ic"><p>Il dataset contiene ${A.length} attività Strava dal ${fd(T0)}/2026 al ${fd(LAST)}/2026. Tutti i calcoli sono eseguiti nel browser; ogni valore rispetta la regola “atleta contro se stesso”: percentili su finestre mobili di 42 giorni, confronto con le 42 giorni precedenti.</p><p><b>Cosa non c’è:</b> FC, potenza, temperatura, lap e split per attività: efficienza aerobica, deriva, durabilità, zone FC e curva potenza/durata non sono calcolabili in questa versione. Perimetro: solo corsa e trail; bici, nuoto e camminate non sono analizzati.</p><p><b>Esclusi:</b> gli altri sport. I pacer (Padova Marathon, Deejay Ten) sono esclusi da PB e metriche di prestazione, ma contano nel volume.</p><p><b>Modelli:</b> carico, forma e stima maratona (Riegel, esponente 1,06) sono stime. La classificazione delle corse usa ritmo medio, durata e titolo; in assenza di certezza la classe è INCERTA.</p><p><b>Aggiornamento:</b> per includere nuove attività si aggiungono righe alla costante RAW nel file e lo si ripubblica.</p></div>`}}};
